services:
  explorer-postgres:
    image: postgres:17-alpine
    container_name: midgard-explorer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: explorer
      POSTGRES_PASSWORD: explorer
      POSTGRES_DB: midgard_explorer
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - explorer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorer -d midgard_explorer"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  explorer-pgdata:
