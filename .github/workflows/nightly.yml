name: Nightly

# The runs that are too slow, too network-dependent, or too large to sit in
# front of every pull request. Each one says what it proves, because a nightly
# job nobody reads is worth less than no job at all.
#
# What is deliberately NOT here: a full Midgard deployment. It needs Cardano
# Node, Kupo, Ogmios, funded Preprod wallets and an on-chain deployment, none of
# which this repository owns or can provision. ADR 3 records it as a documented
# procedure rather than a mode any job runs, and docs/running-full-midgard.md is
# what a person follows by hand.

on:
  schedule:
    # 03:00 UTC, after the day's merges and before the morning.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-matrix:
    name: Frontend under enforced memory ceilings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.10.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-new/pnpm-lock.yaml

      - name: Install the dependencies the ceilings are measured against
        working-directory: frontend-new
        run: pnpm install --frozen-lockfile

      - name: Measure the floors
        # The published figures in docs/resource-requirements.md come from this
        # matrix. It runs nightly rather than per pull request because it takes
        # tens of minutes and its answer changes with the dependency tree, not
        # with a diff.
        run: |
          set -uo pipefail
          mkdir -p gate-evidence
          for mb in 512 768 896 1024 1536 2048; do
            node scripts/dev/measure.mjs "$PWD" limit "$mb" 2>&1 | tail -1 | tee -a gate-evidence/matrix.txt || true
          done
          for mb in 1024 1536 2048; do
            node scripts/dev/measure.mjs "$PWD" limit "$mb" --build 2>&1 | tail -1 | tee -a gate-evidence/matrix.txt || true
          done
          cat gate-evidence/matrix.txt

      - name: Fail if the published floor no longer holds
        # The claim under test is the one the documentation makes: the
        # development server serves at 896 MB and the production build completes
        # at 1536 MB. A regression in either is a change to what a contributor
        # needs, and belongs in the document rather than in someone's surprise.
        run: |
          set -euo pipefail
          grep -q "^896MB dev ok" gate-evidence/matrix.txt
          grep -q "^1536MB build ok" gate-evidence/matrix.txt
          echo "the published floors still hold"

      - name: Report any Turbopack panic
        # Not a failure on its own. One panic has been recorded on this stack,
        # with swap exhausted, and it has not reproduced under an enforced
        # ceiling. A panic here would be the first reproduction and is worth
        # seeing rather than worth failing on.
        if: always()
        run: |
          if grep -q "turbopack-panic" gate-evidence/matrix.txt; then
            echo "::warning::a Turbopack panic reproduced under an enforced ceiling"
          else
            echo "no panic in this matrix"
          fi

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resource-matrix
          path: gate-evidence
          retention-days: 30

  l1-reconciliation:
    name: L1 reconciliation against Koios
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Reaches a third-party service over the network. It is here rather than in
    # the pull-request gate because a failure is as likely to be Koios or the
    # runner's network as it is to be this repository, and a gate that fails for
    # reasons outside the diff stops being read.
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/midgard_node_seeded?schema=public
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: midgard_node_seeded
      INDEXER_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/midgard_explorer_ci
      TEST_INDEXER_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/midgard_explorer_test
      BACKEND_PORT: "3101"
      LOG_LOCATION: ./logs/nightly
      RECENT_BLOCKS_LIMIT: "10"
      RECENT_TRANSACTIONS_LIMIT: "10"
      TRANSACTIONS_PER_PAGE: "25"
      BLOCKS_PER_PAGE: "25"
      KOIOS_BASE_URL: https://preprod.koios.rest/api/v1
      MIDGARD_MANIFEST_PATH: ./test/fixtures/manifest-deployed-preprod.json
      L1_SYNC_ENABLED: "true"
      L1_SYNC_INTERVAL_MS: "30000"
      L1_REORG_LOOKBACK_BLOCKS: "20"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.10.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm indexer:generate && pnpm prisma:generate

      - name: Create and prepare the databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE midgard_node_seeded'
          psql -h localhost -U postgres -c 'CREATE DATABASE midgard_explorer_ci'
          psql -h localhost -U postgres -d midgard_node_seeded -v ON_ERROR_STOP=1 \
            -f test/fixtures/schema/midgard-node.sql
          psql -h localhost -U postgres -d midgard_node_seeded -v ON_ERROR_STOP=1 \
            -f test/fixtures/schema/midgard-node-seed.sql
          pnpm indexer:deploy

      - name: Index until the cursors agree
        # What this proves: a pass in which every source completed, which is the
        # only thing that writes the three cursors, and therefore the only thing
        # that makes strict readiness answer 200. It proves nothing about any
        # deployment's contents.
        run: |
          set -euo pipefail
          mkdir -p ../gate-evidence
          pnpm build
          node dist/index.js > ../gate-evidence/indexer.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3101/healthz >/dev/null && break; sleep 2; done
          for i in $(seq 1 100); do
            if curl -sf http://127.0.0.1:3101/readyz >/dev/null; then
              echo "strict readiness reached"
              curl -s http://127.0.0.1:3101/api/l1/summary | tee ../gate-evidence/summary.json
              exit 0
            fi
            curl -s http://127.0.0.1:3101/api/l1/summary \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.sync.state, j.sync.cursors.map(c=>`${c.source}=${c.height??0}`).join(" "))})'
            sleep 20
          done
          echo "strict readiness was not reached within the budget"
          tail -40 ../gate-evidence/indexer.log
          exit 1

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l1-reconciliation
          path: gate-evidence
          retention-days: 30
