name: Nightly

# The runs that are too slow, too network-dependent, or too large to sit in
# front of every pull request. Each one says what it proves, because a nightly
# job nobody reads is worth less than no job at all.
#
# What is deliberately NOT here: a full Midgard deployment. It needs Cardano
# Node, Kupo, Ogmios, funded Preprod wallets and an on-chain deployment, none of
# which this repository owns or can provision. ADR 3 records it as a documented
# procedure rather than a mode any job runs, and docs/running-full-midgard.md is
# what a person follows by hand.

on:
  schedule:
    # 03:00 UTC, after the day's merges and before the morning.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-matrix:
    name: Frontend under enforced memory ceilings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.10.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-new/pnpm-lock.yaml

      - name: Install the dependencies the ceilings are measured against
        working-directory: frontend-new
        run: pnpm install --frozen-lockfile

      - name: Measure the floors
        # The published figures in docs/resource-requirements.md come from this
        # matrix. It runs nightly rather than per pull request because it takes
        # tens of minutes and its answer changes with the dependency tree, not
        # with a diff.
        run: |
          set -uo pipefail
          mkdir -p gate-evidence
          for mb in 512 768 896 1024 1536 2048; do
            node frontend-new/app/scripts/measure.mjs "$PWD/frontend-new" limit "$mb" 2>&1 | tail -1 | tee -a gate-evidence/matrix.txt || true
          done
          for mb in 1024 1536 2048; do
            node frontend-new/app/scripts/measure.mjs "$PWD/frontend-new" limit "$mb" --build 2>&1 | tail -1 | tee -a gate-evidence/matrix.txt || true
          done
          cat gate-evidence/matrix.txt

      - name: Fail if the published floor no longer holds
        # The claim under test is the one the documentation makes: the
        # development server serves at 896 MB and the production build completes
        # at 1536 MB. A regression in either is a change to what a contributor
        # needs, and belongs in the document rather than in someone's surprise.
        run: |
          set -euo pipefail
          grep -q "^896MB dev ok" gate-evidence/matrix.txt
          grep -q "^1536MB build ok" gate-evidence/matrix.txt
          echo "the published floors still hold"

      - name: Report any Turbopack panic
        # Not a failure on its own. One panic has been recorded on this stack,
        # with swap exhausted, and it has not reproduced under an enforced
        # ceiling. A panic here would be the first reproduction and is worth
        # seeing rather than worth failing on.
        if: always()
        run: |
          if grep -q "turbopack-panic" gate-evidence/matrix.txt; then
            echo "::warning::a Turbopack panic reproduced under an enforced ceiling"
          else
            echo "no panic in this matrix"
          fi

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resource-matrix
          path: gate-evidence
          retention-days: 30

  benchmark-self-tests:
    name: The benchmark harness's own tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    # The harness produces every certified figure in the performance register,
    # and its own tests ran nowhere: five files skipped in every run because the
    # variables that enable them appeared in no workflow and in no .env.example.
    # The least verified component in the repository was the one the numbers
    # come from.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.10.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: A benchmark server that can report the work a query did
        # Started here rather than as a service container, because the probe
        # needs `pg_stat_statements` and that has to be preloaded at startup. A
        # service container takes no command, so a plain postgres service gives
        # a probe that reports "unavailable" and a suite that proves nothing.
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name bench-pg \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres \
            -p 5432:5432 \
            postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 \
            -c shared_preload_libraries=pg_stat_statements
          for i in $(seq 1 60); do
            docker exec bench-pg pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec bench-pg psql -U postgres -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements;'

      - name: The suites that need a benchmark server
        # `pg_stat_statements` reporting and the environment capture, which are
        # how a run reports the work it did and the machine it ran on. Both
        # create and drop their own databases on this service.
        env:
          REQUIRE_DB: "1"
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
          BENCH_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          pnpm vitest run test/bench-pg-stats.test.mts test/bench-environment.test.mts \
            | tee ../bench-self-tests.log
          grep -qE "Tests +[1-9][0-9]* passed" ../bench-self-tests.log || {
            echo "the suites reported no passing test, so they skipped"; exit 1; }

      - name: The target profile, generated end to end
        # In memory, no database and no node: it builds 5,000 blocks and every
        # transaction in them through the codec. Too slow for the pull-request
        # gate, which is why it was gated, and cheap enough for a nightly.
        env:
          BENCH_TARGET: "1"
        run: |
          set -o pipefail
          pnpm vitest run test/bench-target-profile.test.mts | tee ../bench-target.log
          grep -qE "Tests +[1-9][0-9]* passed" ../bench-target.log || {
            echo "the target profile suite skipped rather than running"; exit 1; }

      # `bench-smoke` is deliberately absent. It runs the whole harness, which
      # needs BENCH_SOURCE_NODE_URL: a Midgard node database holding at least as
      # many submitted commitments as the profile settles. A node is exactly
      # what this repository cannot provision, and seeding invented hashes to
      # satisfy the check would defeat the check. It runs where a node is,
      # against `--profile small --mode smoke`.

      - if: always()
        working-directory: .
        run: docker rm -f bench-pg || true

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-self-tests
          path: "*.log"
          retention-days: 7
